# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# DadaLink build options (override in ~/.gradle/gradle.properties or with -P)
# Base URL of the DadaLink API. Endpoints are not final yet.
dadalink.apiBaseUrl=https://api.dadalink.org/
# Use in-process fakes for the assistant and SOS relay until the backend ships.
dadalink.useFakeBackend=true
