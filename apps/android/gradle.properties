# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# DadaLink build options (override in ~/.gradle/gradle.properties or with -P)
# Base URL of the DadaLink API (same origin as the web app). For a local server from the emulator:
#   -Pdadalink.apiBaseUrl=http://10.0.2.2:3000   (debug builds allow cleartext to 10.0.2.2/localhost only)
dadalink.apiBaseUrl=https://dadalink.recitelabs.com
# true = in-process fakes (canned assistant, no relay, bundled content only, no sync).
dadalink.useFakeBackend=false
