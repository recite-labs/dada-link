  - id: faq-want-to-go-home
    question:
      en: I want to go home before my contract ends. How?
      am: ውሌ ሳያልቅ ወደ አገሬ መመለስ እፈልጋለሁ። እንዴት?
      om: Waliigalteen koo osoo hin xumuramin gara biyyaatti deebi'uu barbaada. Akkamitti?
    answer:
      en: "You can ask for help to go home. First, try to collect any wages you are owed and keep copies of your documents. Talk to your agency and your employer if it is safe. Your embassy can advise you and, if your passport is not with you, may help with a travel document. The rules on who pays the ticket are different in each country; see your country's rights page. Read 'Preparing to return' before you leave."
      am: "ወደ አገርዎ ለመመለስ እርዳታ መጠየቅ ይችላሉ። በመጀመሪያ ያልተከፈለዎትን ደሞዝ ለመቀበል ይሞክሩ፣ የሰነዶችዎን ቅጂ ያስቀምጡ። ደኅንነቱ ከተጠበቀ ከኤጀንሲዎና ከአሰሪዎ ጋር ይነጋገሩ። ኤምባሲዎ ምክር ሊሰጥዎ ይችላል፤ ፓስፖርትዎ ከእርስዎ ጋር ካልሆነም የጉዞ ሰነድ ለማግኘት ሊረዳዎ ይችላል። ትኬቱን ማን እንደሚከፍል ደንቡ በየአገሩ ይለያያል፤ የአገርዎን የመብት ገጽ ይመልከቱ። ከመሄድዎ በፊት «ለመመለስ መዘጋጀት»ን ያንብቡ።"
      om: "Gara biyyaatti deebi'uuf gargaarsa gaafachuu dandeessa. Jalqaba mindaa siif hin kaffalamne argachuuf yaali, garagalcha sanadoota keetii kuusi. Yoo nagaa ta'e ejensii fi hojjechiisaa kee wajjin haasa'i. Embaasiin kee gorsa siif kennuu danda'a; paaspoortiin kee si bira yoo hin jirre, sanada imalaa argachuuf si gargaaruu danda'a. Tikeetii eenyu akka kaffalu seerri biyyaa biyyatti adda; fuula mirgaa biyya keetii ilaali. Osoo hin deemin dura 'Deebi'uuf qophaa'uu' dubbisi."
    status: draft-ai
    tags: [repatriation, documents]
    countries: []
    emergency: false
    articles: [preparing-to-return, contacting-your-embassy, leaving-a-bad-employer]
    sources: []
    verified: false

  - id: faq-contract-differs
    question:
      en: My job or salary is different from what my contract says. What can I do?
      am: ሥራዬ ወይም ደሞዜ በውሌ ከተጻፈው የተለየ ነው። ምን ማድረግ እችላለሁ?
      om: Hojiin koo ykn mindaan koo waan waliigaltee koo keessatti barreeffame irraa adda. Maal gochuu danda'a?
    answer:
      en: "Your signed contract is what counts. Keep a photo of the contract you signed in Ethiopia. Write down how your real job and pay are different, with dates, in your private log. Tell your agency, both the one in Ethiopia and the one in the destination country. If it is not fixed, you can complain to the labour ministry or ask your embassy. See your country's rights page for how."
      am: "የሚቆጠረው የፈረሙት ውል ነው። በኢትዮጵያ የፈረሙትን ውል ፎቶ ያስቀምጡ። እውነተኛው ሥራዎና ክፍያዎ እንዴት እንደሚለይ ከቀን ጋር በግል ማስታወሻዎ ይጻፉ። በኢትዮጵያና በመዳረሻ አገሩ ያሉትን ሁለቱንም ኤጀንሲዎች ያሳውቁ። ካልተስተካከለ ለሠራተኛ ሚኒስቴር ማመልከት ወይም ኤምባሲዎን መጠየቅ ይችላሉ። እንዴት እንደሆነ የአገርዎን የመብት ገጽ ይመልከቱ።"
      om: "Kan lakkaa'amu waliigaltee mallatteessite dha. Suuraa waliigaltee Itoophiyaatti mallatteessite kuusi. Hojiin fi mindaan kee dhugaa akkamitti akka adda ta'e, guyyaa wajjin galmee dhuunfaa keessatti barreessi. Ejensii Itoophiyaa fi kan biyya itti deemteetii lamaanuu beeksisi. Yoo hin sirreeffamne, ministeera hojjettootaatti komii dhiyeessuu ykn embaasii kee gaafachuu dandeessa. Akkamitti akka ta'e fuula mirgaa biyya keetii ilaali."
    status: draft-ai
    tags: [labour-complaint, wages, documents]
    countries: []
    emergency: false
    articles: [your-contract, unpaid-wages, documents-to-copy]
    sources: []
    verified: false

  - id: faq-pregnant-abroad
    question:
      en: I think I am pregnant. I am scared. What should I do?
      am: እርጉዝ የሆንኩ ይመስለኛል። ፈርቻለሁ። ምን ማድረግ አለብኝ?
      om: Ulfa kan qabu natti fakkaata. Nan sodaadha. Maal gochuu qaba?
    answer:
      en: "It is normal to feel scared. You are not alone, and you deserve care without judgement. In some of these countries, pregnancy outside marriage can bring legal problems, so get confidential advice before you tell people you do not trust. Your embassy, IOM or a support organisation in Help numbers can advise you. See a doctor for a pregnancy check. Do not take pills or treatments from unknown sellers; they can be very dangerous. If you have heavy bleeding, strong belly pain or fever, call the ambulance number now."
      am: "መፍራት የተለመደ ነው። ብቻዎን አይደሉም፤ ያለ ፍርድ እንክብካቤ ይገባዎታል። በአንዳንዶቹ በእነዚህ አገሮች ከጋብቻ ውጭ እርግዝና የሕግ ችግር ሊያመጣ ስለሚችል ለማያምኗቸው ሰዎች ከመናገርዎ በፊት ሚስጥራዊ ምክር ያግኙ። ኤምባሲዎ፣ IOM ወይም በ«የእርዳታ ቁጥሮች» ያለ የድጋፍ ድርጅት ሊመክርዎ ይችላል። ለእርግዝና ምርመራ ሐኪም ያግኙ። ከማያውቋቸው ሻጮች ኪኒን ወይም ሕክምና አይውሰዱ፤ በጣም አደገኛ ሊሆን ይችላል። ብዙ ደም ቢፈስ፣ ከባድ የሆድ ሕመም ወይም ትኩሳት ቢኖርዎ አሁኑኑ የአምቡላንስ ቁጥር ይደውሉ።"
      om: "Sodaachuun waan baramaa dha. Ati qofaa kee miti; murtii malee kunuunsi siif mala. Biyyoota kanneen keessaa tokko tokkotti ulfi gaa'ela alaa rakkoo seeraa fiduu waan danda'uuf, namoota hin amanneetti osoo hin himin dura gorsa iccitii argadhu. Embaasiin kee, IOM ykn dhaabbanni deeggarsaa 'Lakkoofsota Gargaarsaa' keessa jiru si gorsuu danda'u. Qorannoo ulfaatiif ogeessa fayyaa argadhu. Kiniinii ykn yaala gurgurtoota hin beekne irraa hin fudhatin; baay'ee balaafamaa ta'uu danda'a. Yoo dhiigni baay'een si irraa dhangala'e, garaan si dhukkube ykn ho'i qaama si qabe, amma lakkoofsa ambulaansii bilbili."
    status: draft-ai
    tags: [health, legal]
    countries: []
    emergency: false
    articles: [pregnancy-abroad, legal-risks-abroad, contacting-your-embassy]
    sources: []
    verified: false

  - id: faq-contraception
    question:
      en: How can I avoid getting pregnant while I work abroad?
      am: ውጭ አገር እየሠራሁ እርግዝናን እንዴት መከላከል እችላለሁ?
      om: Biyya alaatti osoon hojjechaa jiruu akkamitti ulfa ittisuu danda'a?
    answer:
      en: "This is your choice and your body. Long-acting methods such as an implant, an injection or an IUD are easiest to start in Ethiopia before you leave, at a health centre or family planning clinic. Condoms also protect against HIV and other infections. If you had sex without protection, emergency contraception works up to 5 days after, best as soon as possible. Ask a health worker which method suits you."
      am: "ይህ የእርስዎ ምርጫና የእርስዎ ሰውነት ነው። እንደ ኢምፕላንት፣ መርፌ ወይም IUD ያሉ ረጅም ጊዜ የሚቆዩ ዘዴዎችን ከመሄድዎ በፊት በኢትዮጵያ በጤና ጣቢያ ወይም በቤተሰብ ዕቅድ ክሊኒክ መጀመር ቀላል ነው። ኮንዶም ከኤች አይ ቪና ከሌሎች በሽታዎችም ይከላከላል። ያለ መከላከያ ወሲብ ከፈጸሙ፣ የድንገተኛ ጊዜ መከላከያ እስከ 5 ቀን ይሠራል፤ በተቻለ ፍጥነት ቢወሰድ ይሻላል። የትኛው ዘዴ እንደሚስማማዎ የጤና ባለሙያ ይጠይቁ።"
      om: "Kun filannoo kee fi qaama kee ti. Malli yeroo dheeraa turu kan akka impilaantii, lilmoo ykn IUD, osoo hin deemin dura Itoophiyaatti buufata fayyaa ykn kilinika karoora maatii keessatti jalqabuun salphaa dha. Kondoomiin HIV fi dhukkuboota biroo irraas ni eega. Yoo eegumsa malee wal-qunnamtii saalaa raawwatte, qorichi ulfa ittisu kan yeroo tasaa hanga guyyaa 5tti hojjeta; hamma danda'ametti dafee fudhachuu wayya. Mala kamtu siif akka ta'u hojjetaa fayyaa gaafadhu."
    status: draft-ai
    tags: [health]
    countries: []
    emergency: false
    articles: [contraception-and-srh-before-you-go, health-preparation]
    sources:
      - url: https://www.who.int/news-room/fact-sheets/detail/emergency-contraception
        title: Emergency contraception (fact sheet)
        publisher: World Health Organization
        accessed: 2026-10-31
    verified: false

  - id: faq-lonely-sad
    question:
      en: I feel very lonely and sad all the time. Is something wrong with me?
      am: ሁልጊዜ በጣም ብቸኝነትና ሐዘን ይሰማኛል። የሆነ ችግር አለብኝ?
      om: Yeroo hunda kophummaa fi gadda guddaa natti dhaga'ama. Wanti na mudate jiraa?
    answer:
      en: "Nothing is wrong with you. Being far from home, working hard and feeling alone is very heavy, and many women feel this way. Small things can help: a short call or message to someone you love, prayer, slow breathing, a little routine each day, and sleep when you can. Use the mood check-in in DadaLink. If the sadness does not go away, or you cannot eat or sleep, please reach out to your embassy or a support organisation in Help numbers."
      am: "ምንም ችግር የለብዎትም። ከቤት ርቆ፣ ጠንክሮ እየሠሩ ብቸኝነት መሰማት በጣም ከባድ ነው፤ ብዙ ሴቶችም እንዲህ ይሰማቸዋል። ትናንሽ ነገሮች ይረዳሉ፤ ለሚወዱት ሰው አጭር ጥሪ ወይም መልእክት፣ ጸሎት፣ በቀስታ መተንፈስ፣ በየቀኑ ትንሽ ልማድ፣ እና በቻሉ ጊዜ እንቅልፍ። በDadaLink ያለውን የስሜት መከታተያ ይጠቀሙ። ሐዘኑ ካልሄደ ወይም መብላትና መተኛት ካልቻሉ፣ እባክዎ ኤምባሲዎን ወይም በ«የእርዳታ ቁጥሮች» ያለ የድጋፍ ድርጅት ያግኙ።"
      om: "Homtuu si hin mudanne. Mana irraa fagaachuun, cimsanii hojjechuun fi kophummaan baay'ee ulfaata; dubartoonni baay'een akkasuma itti dhaga'ama. Wantoonni xixiqqoon ni gargaaru: nama jaallattuuf bilbila gabaabaa ykn ergaa, kadhannaa, suuta hafuura baafachuu, guyyaa guyyaan aadaa xiqqaa, fi yeroo dandeessutti hirriba. Hordoffii miiraa DadaLink keessa jiru fayyadami. Yoo gaddi sun hin deemne ykn nyaachuu fi rafuu dadhabde, maaloo embaasii kee ykn dhaabbata deeggarsaa 'Lakkoofsota Gargaarsaa' keessa jiru quunnamu."
    status: draft-ai
