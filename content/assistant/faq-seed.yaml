  - id: faq-sexual-assault
    question:
      en: Someone forced me into sex. What can I do?
      am: አንድ ሰው በግድ ወሲብ ፈጸመብኝ። ምን ማድረግ እችላለሁ?
      om: Namni tokko humnaan wal-qunnamtii saalaa narratti raawwate. Maal gochuu danda'a?
    answer:
      en: "I am so sorry this happened. It is not your fault. First, get to a safe place if you can; press SOS or call the emergency number in Help numbers if you are in danger. See a doctor as soon as possible. Medicine to prevent HIV (PEP) must be started within 72 hours. Emergency contraception works up to 5 days after, and works best the sooner you take it. Reporting to police is your choice. Your embassy, a shelter or a support organisation can help you. You are not alone."
      am: "ይህ ስለደረሰብዎ በጣም አዝናለሁ። የእርስዎ ጥፋት አይደለም። በመጀመሪያ ከቻሉ ደኅንነቱ ወደተጠበቀ ቦታ ይሂዱ፤ አደጋ ላይ ከሆኑ SOS ይጫኑ ወይም በ«የእርዳታ ቁጥሮች» ያለውን የአደጋ ጊዜ ቁጥር ይደውሉ። በተቻለ ፍጥነት ሐኪም ያግኙ። ኤች አይ ቪን የሚከላከለው መድኃኒት (PEP) በ72 ሰዓት ውስጥ መጀመር አለበት። የድንገተኛ ጊዜ የእርግዝና መከላከያ እስከ 5 ቀን ድረስ ይሠራል፤ ቶሎ ሲወሰድ የበለጠ ይሠራል። ለፖሊስ ማሳወቅ የእርስዎ ምርጫ ነው። ኤምባሲዎ፣ መጠለያ ወይም የድጋፍ ድርጅት ሊረዱዎት ይችላሉ። ብቻዎን አይደሉም።"
      om: "Kun waan sirra ga'eef baay'een gadda. Dogoggora kee miti. Jalqaba, yoo dandeesse bakka nagaa dhaqi; yoo balaa keessa jirta SOS tuqi ykn lakkoofsa balaa tasaa 'Lakkoofsota Gargaarsaa' keessa jiru bilbili. Hamma dandeessu dafii ogeessa fayyaa argadhu. Qorichi HIV ittisu (PEP) sa'aatii 72 keessatti jalqabamuu qaba. Qorichi ulfa ittisu kan yeroo tasaa hanga guyyaa 5tti hojjeta; yeroo dafee fudhatamu caalaatti hojjeta. Poolisiitti himuun filannoo kee ti. Embaasiin kee, iddoon baqannaa ykn dhaabbanni deeggarsaa si gargaaruu danda'u. Ati qofaa kee miti."
    status: draft-ai
    tags: [sexual-violence, health, emergency]
    countries: []
    emergency: true
    articles: [sexual-violence-what-to-do, abuse-what-to-do]
    sources:
      - url: https://www.cdc.gov/stophivtogether/hiv-prevention/pep.html
        title: "PEP | HIV Prevention | Let's Stop HIV Together"
        publisher: US Centers for Disease Control and Prevention
        accessed: 2026-10-31
        note: PEP must be started within 72 hours; taken daily for 28 days.
      - url: https://www.who.int/news-room/fact-sheets/detail/emergency-contraception
        title: Emergency contraception (fact sheet)
        publisher: World Health Organization
        accessed: 2026-10-31
        note: Pills within 120 hours, as early as possible; copper IUD within 5 days.
