  - id: faq-unpaid-wages
    question:
      en: My employer has not paid my salary. What should I do?
      am: አሰሪዬ ደሞዜን አልከፈለኝም። ምን ማድረግ አለብኝ?
      om: Hojjechiisaan koo mindaa koo hin kaffalle. Maal gochuu qaba?
    answer:
      en: "You have a right to be paid what your contract says. Start a record today in your private log: each month, the amount you should get, what you got, and the date. Keep photos of your contract and any payment slips or bank messages. Ask your employer politely, and tell your agency. If you are still not paid, you can complain to the labour ministry or ask your embassy for help. See your country's rights page for the complaint channels."
      am: "በውልዎ የተጻፈውን ደሞዝ የማግኘት መብት አለዎት። ዛሬውኑ በግል ማስታወሻዎ መመዝገብ ይጀምሩ፤ በየወሩ ማግኘት የነበረብዎን፣ ያገኙትን እና ቀኑን። የውልዎን፣ የክፍያ ደረሰኞችን ወይም የባንክ መልእክቶችን ፎቶ ያስቀምጡ። አሰሪዎን በትሕትና ይጠይቁ፣ ኤጀንሲዎንም ያሳውቁ። አሁንም ካልተከፈለዎት ለሠራተኛ ሚኒስቴር ማመልከት ወይም ኤምባሲዎን መጠየቅ ይችላሉ። የአቤቱታ መንገዶችን በአገርዎ የመብት ገጽ ይመልከቱ።"
      om: "Waan waliigalteen kee jedhu kaffalamuuf mirga qabda. Har'uma galmee dhuunfaa kee keessatti galmeessuu jalqabi: ji'a ji'aan, hamma argachuu qabdu, hamma argatte fi guyyaa. Suuraa waliigaltee keetii fi ragaa kaffaltii ykn ergaa baankii kaa'i. Hojjechiisaa kee kabajaan gaafadhu, ejensii kees beeksisi. Ammas yoo hin kaffalamne, ministeera hojjettootaatti komii dhiyeessuu ykn embaasii kee gaafachuu dandeessa. Karaalee komii fuula mirgaa biyya keetii keessatti ilaali."
    status: draft-ai
    tags: [wages, labour-complaint]
