  - id: faq-detained
    question:
      en: I was arrested or I am in a deportation centre. What are my rights?
      am: ታስሬያለሁ ወይም በማባረሪያ ማዕከል ውስጥ ነኝ። መብቶቼ ምንድን ናቸው?
      om: Hidhameera ykn giddugala baasiinsaa keessa jira. Mirgoonni koo maal fa'i?
    answer:
      en: "You can ask to contact the Ethiopian embassy or consulate. Tell officials your full name and that you are Ethiopian. Ask for medical care if you are sick, pregnant or injured. Do not sign papers you do not understand; ask for an interpreter. If you have unpaid wages, tell the embassy so it can be recorded. Read 'Detention and deportation' for more."
      am: "የኢትዮጵያ ኤምባሲን ወይም ቆንስላን ለማግኘት መጠየቅ ይችላሉ። ለባለሥልጣናት ሙሉ ስምዎንና ኢትዮጵያዊት መሆንዎን ይንገሩ። ከታመሙ፣ እርጉዝ ከሆኑ ወይም ከተጎዱ ሕክምና ይጠይቁ። የማይረዱትን ወረቀት አይፈርሙ፤ አስተርጓሚ ይጠይቁ። ያልተከፈለ ደሞዝ ካለዎት እንዲመዘገብ ለኤምባሲው ይንገሩ። ለበለጠ «እስርና ማባረር»ን ያንብቡ።"
      om: "Embaasii ykn koonsilaa Itoophiyaa quunnamuuf gaafachuu dandeessa. Abbootii taayitaatti maqaa kee guutuu fi Itoophiyaawittii ta'uu kee himi. Yoo dhukkubsatte, ulfa qabaatte ykn miidhamte yaala fayyaa gaafadhu. Waraqaa hin hubanne hin mallatteessin; hiikaa gaafadhu. Yoo mindaa hin kaffalamne qabaatte, akka galmeeffamuuf embaasiitti himi. Dabalataaf 'Hidhaa fi baasiinsa' dubbisi."
    status: draft-ai
    tags: [detention, legal, repatriation]
    countries: []
    emergency: false
