  - id: faq-returnee-support
    question:
      en: I just came back and I feel lost. Where can I get support?
      am: አሁን ተመልሻለሁ፤ ግራ ተጋብቻለሁ። ድጋፍ ከየት ማግኘት እችላለሁ?
      om: Amma deebi'e, burjaaja'eera. Deeggarsa eessaa argachuu danda'a?
    answer:
      en: "Coming home can be hard, even when you are glad to be back. Feeling tired, sad, angry or worried is a normal reaction. You can look for returnee services, health and mental-health support in Help numbers (Ethiopia). Some organisations help with shelter, counselling, skills training and small business support. Take things one step at a time, and talk to someone you trust."
      am: "ወደ ቤት መመለስ ቢያስደስትም ከባድ ሊሆን ይችላል። ድካም፣ ሐዘን፣ ቁጣ ወይም ጭንቀት መሰማት የተለመደ ምላሽ ነው። የተመላሾች አገልግሎቶችን፣ የጤናና የአእምሮ ጤና ድጋፍ በ«የእርዳታ ቁጥሮች» (ኢትዮጵያ) ውስጥ መፈለግ ይችላሉ። አንዳንድ ድርጅቶች በመጠለያ፣ በምክር፣ በክህሎት ስልጠናና በአነስተኛ ንግድ ድጋፍ ይረዳሉ። ነገሮችን ደረጃ በደረጃ ይውሰዱ፤ ከሚያምኑት ሰው ጋር ይነጋገሩ።"
      om: "Gara manaatti deebi'uun, yeroo itti gammaddellee, ulfaachuu danda'a. Dadhabbiin, gaddi, aariin ykn yaaddoon sitti dhaga'amuun deebii baramaa dha. Tajaajila deebi'ootaa, deeggarsa fayyaa fi fayyaa sammuu 'Lakkoofsota Gargaarsaa' (Itoophiyaa) keessatti barbaaduu dandeessa. Dhaabbileen tokko tokko iddoo baqannaa, gorsa, leenjii ogummaa fi deeggarsa daldala xiqqaatiin gargaaru. Wantoota tarkaanfii tarkaanfiin fudhadhu, nama amanattu wajjin haasa'i."
    status: draft-ai
    tags: [returnee-support, mental-health]
