  - id: faq-passport-taken
    question:
      en: My employer took my passport. What can I do?
      am: አሰሪዬ ፓስፖርቴን ወሰደብኝ። ምን ማድረግ እችላለሁ?
      om: Hojjechiisaan koo paaspoortii koo fudhate. Maal gochuu danda'a?
    answer:
      en: "This happens to many women. It is not your fault. Keep a photo of your passport and visa on your phone and with someone you trust at home. Write down the date it was taken in your private log. Ask calmly for it back, or ask where it is kept. In several of these countries the law does not let employers keep your passport; see your country's rights page. You can complain to the labour ministry or ask your embassy for help. Their numbers are in Help numbers."
      am: "ይህ በብዙ ሴቶች ላይ ይደርሳል። የእርስዎ ጥፋት አይደለም። የፓስፖርትዎንና የቪዛዎን ፎቶ በስልክዎ እና በቤት ካለ የሚያምኑት ሰው ጋር ያስቀምጡ። የተወሰደበትን ቀን በግል ማስታወሻዎ ይጻፉ። በእርጋታ እንዲመለስልዎ ወይም የት እንደተቀመጠ ይጠይቁ። በብዙዎቹ በእነዚህ አገሮች ሕጉ አሰሪ ፓስፖርትዎን እንዲይዝ አይፈቅድም፤ የአገርዎን የመብት ገጽ ይመልከቱ። ለሠራተኛ ሚኒስቴር ማመልከት ወይም ኤምባሲዎን እርዳታ መጠየቅ ይችላሉ። ቁጥሮቻቸው በ«የእርዳታ ቁጥሮች» ውስጥ አሉ።"
      om: "Kun dubartoota baay'ee irra ga'a. Dogoggora kee miti. Suuraa paaspoortii fi viizaa keetii bilbila kee irratti, akkasumas nama amanattu mana jiru biratti kaa'i. Guyyaa itti fudhatame galmee dhuunfaa kee keessatti barreessi. Akka siif deebisan ykn eessa akka kaa'ame gaafadhu. Biyyoota kanneen keessaa hedduu keessatti seerri hojjechiisaan paaspoortii kee akka qabatu hin hayyamu; fuula mirgaa biyya keetii ilaali. Ministeera hojjettootaatti komii dhiyeessuu ykn embaasii kee gargaarsa gaafachuu dandeessa. Lakkoofsi isaanii 'Lakkoofsota Gargaarsaa' keessa jira."
    status: draft-ai
    tags: [passport, documents, labour-complaint]
