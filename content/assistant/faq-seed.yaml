  - id: faq-no-day-off
    question:
      en: I never get a day off. Is that allowed?
      am: አንድም የእረፍት ቀን አላገኝም። ይህ ይፈቀዳል?
      om: Guyyaa boqonnaa tokkollee hin argadhu. Kun hayyamamaadhaa?
    answer:
      en: "You deserve rest. Most of these countries now have rules about a weekly day off and daily rest for domestic workers, but the details are different in each country. Check your country's rights page. Write your working hours and days off in your private log. Talk calmly with your employer about a rest day. If nothing changes, you can contact the labour ministry or your embassy."
      am: "እረፍት ይገባዎታል። አብዛኞቹ እነዚህ አገሮች ለቤት ሠራተኞች ሳምንታዊ የእረፍት ቀንና የዕለት እረፍት ደንብ አላቸው፤ ዝርዝሩ ግን በየአገሩ ይለያያል። የአገርዎን የመብት ገጽ ይመልከቱ። የሥራ ሰዓትዎንና የእረፍት ቀናትዎን በግል ማስታወሻዎ ይጻፉ። ስለ እረፍት ቀን ከአሰሪዎ ጋር በእርጋታ ይነጋገሩ። ምንም ካልተለወጠ ሠራተኛ ሚኒስቴርን ወይም ኤምባሲዎን ማግኘት ይችላሉ።"
      om: "Boqonnaan siif ni mala. Biyyoonni kunneen baay'een isaanii hojjettoota manaatiif guyyaa boqonnaa torbanii fi boqonnaa guyyaa guyyaa irratti seera qabu, garuu bal'inni isaa biyyaa biyyatti garaa garummaa qaba. Fuula mirgaa biyya keetii ilaali. Sa'aatii hojii fi guyyoota boqonnaa kee galmee dhuunfaa keessatti barreessi. Waa'ee guyyaa boqonnaa hojjechiisaa kee wajjin tasgabbiin haasa'i. Yoo homtuu hin jijjiiramne, ministeera hojjettootaa ykn embaasii kee quunnamuu dandeessa."
    status: draft-ai
    tags: [labour-complaint]
    countries: []
    emergency: false
    articles: [rest-and-working-hours]
    sources: []
    verified: false

  - id: faq-too-many-hours
    question:
      en: I work from early morning to late at night and I am always tired. What can I do?
      am: ከማለዳ እስከ ሌሊት እሠራለሁ፤ ሁልጊዜ ደክሞኛል። ምን ማድረግ እችላለሁ?
      om: Ganama barii hanga halkan dheeraatti nan hojjedha, yeroo hunda nan dadhabaa. Maal gochuu danda'a?
    answer:
      en: "Very long hours with no sleep are harmful, and it is right to ask for rest. Write down when you start and stop each day in your private log. That record helps if you complain later. Look at your country's rights page to see the rules on hours and rest. Try to eat, drink water and sleep when you can. If you feel unwell or unsafe, use Help numbers or the SOS button."
      am: "ያለ እንቅልፍ ረጅም ሰዓት መሥራት ይጎዳል፤ እረፍት መጠየቅ ትክክል ነው። በየቀኑ የሚጀምሩበትንና የሚጨርሱበትን ሰዓት በግል ማስታወሻዎ ይጻፉ። ይህ መዝገብ በኋላ ቅሬታ ካቀረቡ ይረዳዎታል። ስለ ሥራ ሰዓትና እረፍት ደንቦቹን በአገርዎ የመብት ገጽ ይመልከቱ። በቻሉ ጊዜ ይመገቡ፣ ውሃ ይጠጡ፣ ይተኙ። ጤና ካልተሰማዎት ወይም ደኅንነት ካልተሰማዎት «የእርዳታ ቁጥሮች»ን ወይም የSOS ቁልፉን ይጠቀሙ።"
      om: "Sa'aatii dheeraa hirriba malee hojjechuun miidhaa qaba; boqonnaa gaafachuun sirrii dha. Guyyaa guyyaan yeroo jalqabdu fi xumurtu galmee dhuunfaa kee keessatti barreessi. Galmeen kun yoo booda komii dhiyeessite si gargaara. Seera sa'aatii hojii fi boqonnaa fuula mirgaa biyya keetii keessatti ilaali. Yeroo dandeessutti nyaadhu, bishaan dhugi, rafi. Yoo dhukkubsatte ykn nageenya dhabde, 'Lakkoofsota Gargaarsaa' ykn furtuu SOS fayyadami."
    status: draft-ai
    tags: [labour-complaint, health]
    countries: []
    emergency: false
    articles: [rest-and-working-hours, sick-or-injured]
    sources: []
    verified: false

  - id: faq-sick-no-care
    question:
      en: I am sick and my employer will not take me to a doctor. What should I do?
      am: ታምሜያለሁ፤ አሰሪዬ ወደ ሐኪም አይወስደኝም። ምን ላድርግ?
      om: Nan dhukkubsadha, hojjechiisaan koo gara ogeessa fayyaa na hin geessu. Maal gochuu qaba?
    answer:
      en: "Your health matters. If it is serious (trouble breathing, heavy bleeding, chest pain, fainting, a bad injury), call the ambulance number in Help numbers now or press SOS. If it is not urgent, tell your employer clearly what you feel and ask for a doctor. Write down your symptoms and dates in your private log. Your country's rights page explains what health care the law says you should get. Your embassy or agency can also help."
      am: "ጤናዎ አስፈላጊ ነው። ከባድ ከሆነ (መተንፈስ መቸገር፣ ብዙ ደም መፍሰስ፣ የደረት ሕመም፣ መውደቅ፣ ከባድ ጉዳት) አሁኑኑ በ«የእርዳታ ቁጥሮች» ያለውን የአምቡላንስ ቁጥር ይደውሉ ወይም SOS ይጫኑ። አስቸኳይ ካልሆነ የሚሰማዎትን ለአሰሪዎ በግልጽ ይንገሩና ሐኪም ይጠይቁ። ምልክቶችንና ቀኖችን በግል ማስታወሻዎ ይጻፉ። ሕጉ ምን ዓይነት የጤና አገልግሎት እንደሚሰጥዎ በአገርዎ የመብት ገጽ ይገኛል። ኤምባሲዎ ወይም ኤጀንሲዎ ሊረዱ ይችላሉ።"
      om: "Fayyaan kee barbaachisaa dha. Yoo cimaa ta'e (hafuura baafachuu dadhabuu, dhiigni baay'ee dhangala'uu, dhukkubbii qomaa, kufuu, miidhaa cimaa), amma lakkoofsa ambulaansii 'Lakkoofsota Gargaarsaa' keessa jiru bilbili ykn SOS tuqi. Yoo ariifachiisaa hin taane, waan sitti dhaga'amu hojjechiisaa keetti ifatti himiitii ogeessa fayyaa gaafadhu. Mallattoolee fi guyyoota galmee dhuunfaa keessatti barreessi. Tajaajila fayyaa seerri siif kennu fuula mirgaa biyya keetii keessatti argatta. Embaasiin kee ykn ejensiin kee si gargaaruu danda'u."
    status: draft-ai
    tags: [health, emergency]
    countries: []
    emergency: false
    articles: [sick-or-injured, health-preparation]
    sources: []
    verified: false

  - id: faq-employer-hits-me
    question:
      en: My employer hits me or threatens me. What can I do?
      am: አሰሪዬ ይመታኛል ወይም ያስፈራራኛል። ምን ማድረግ እችላለሁ?
      om: Hojjechiisaan koo na reebu ykn na sodaachisa. Maal gochuu danda'a?
    answer:
      en: "No one has the right to hurt you. This is not your fault. If you are in danger now, press SOS or call the police or emergency number in Help numbers. When you are safe, keep evidence if you can: photos of injuries, dates and what happened, in your private log. Contact your embassy, a shelter or a support organisation from Help numbers. You can also complain to the labour ministry or police. You do not have to face this alone."
      am: "ማንም ሊጎዳዎ መብት የለውም። ይህ የእርስዎ ጥፋት አይደለም። አሁን አደጋ ላይ ከሆኑ SOS ይጫኑ ወይም በ«የእርዳታ ቁጥሮች» ያለውን የፖሊስ ወይም የአደጋ ጊዜ ቁጥር ይደውሉ። ደኅንነትዎ ሲጠበቅ ከቻሉ ማስረጃ ያስቀምጡ፤ የጉዳት ፎቶ፣ ቀንና የሆነውን በግል ማስታወሻዎ። ኤምባሲዎን፣ መጠለያ ወይም የድጋፍ ድርጅት ከ«የእርዳታ ቁጥሮች» ያግኙ። ለሠራተኛ ሚኒስቴር ወይም ለፖሊስ ማመልከትም ይችላሉ። ብቻዎን መጋፈጥ የለብዎትም።"
      om: "Namni kamiyyuu si miidhuuf mirga hin qabu. Kun dogoggora kee miti. Yoo amma balaa keessa jirta ta'e, SOS tuqi ykn lakkoofsa poolisii ykn balaa tasaa 'Lakkoofsota Gargaarsaa' keessa jiru bilbili. Yeroo nagaa taatetti, yoo dandeesse ragaa kuusi: suuraa miidhaa, guyyaa fi waan ta'e galmee dhuunfaa keessatti. Embaasii kee, iddoo baqannaa ykn dhaabbata deeggarsaa 'Lakkoofsota Gargaarsaa' irraa quunnamu. Ministeera hojjettootaa ykn poolisiitti komii dhiyeessuus dandeessa. Kana qofaa kee hin qabattu."
    status: draft-ai
    tags: [abuse, emergency, shelter]
    countries: []
    emergency: true
