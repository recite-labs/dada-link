    sources: []
    verified: false

  - id: faq-wages-after-return
    question:
      en: I came home but my employer still owes me money. Can I still get it?
      am: ወደ አገሬ ተመልሻለሁ፤ ግን አሰሪዬ አሁንም ገንዘብ አለብኝ። አሁንም ማግኘት እችላለሁ?
      om: Gara biyyaatti deebi'eera, garuu hojjechiisaan koo ammallee maallaqa na qaba. Ammallee argachuu nan danda'aa?
    answer:
      en: "It is harder after you return, but sometimes possible. Gather your proof: contract, wage records from your private log, messages and bank slips. Contact the agency that sent you, and the Ministry of Labour and Skills. You can also ask the embassy in the country where you worked about a claim. Read 'Claiming unpaid wages after return' for the steps."
      am: "ከተመለሱ በኋላ ከባድ ነው፤ አንዳንድ ጊዜ ግን ይቻላል። ማስረጃዎን ያሰባስቡ፤ ውል፣ ከግል ማስታወሻዎ የደሞዝ መዝገብ፣ መልእክቶችና የባንክ ደረሰኞች። የላከዎትን ኤጀንሲና የሥራና ክህሎት ሚኒስቴርን ያግኙ። በሠሩበት አገር ያለውን ኤምባሲም ስለ አቤቱታ መጠየቅ ይችላሉ። ደረጃዎቹን «ከተመለሱ በኋላ ያልተከፈለ ደሞዝ መጠየቅ» ውስጥ ያንብቡ።"
      om: "Erga deebitee booda ulfaataa dha, garuu yeroo tokko tokko ni danda'ama. Ragaa kee walitti qabi: waliigaltee, galmee mindaa galmee dhuunfaa keessaa, ergaawwan fi nagahee baankii. Ejensii si erge fi Ministeera Hojii fi Ogummaa quunnamu. Embaasii biyya itti hojjette keessa jiru waa'ee komii gaafachuus dandeessa. Tarkaanfiiwwan 'Mindaa hin kaffalamne erga deebi'anii booda gaafachuu' keessatti dubbisi."
    status: draft-ai
    tags: [wages, returnee-support, labour-complaint]
