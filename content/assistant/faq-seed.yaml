    sources: []
    verified: false

  - id: faq-suicidal-thoughts
    question:
      en: I do not want to live anymore.
      am: ከእንግዲህ መኖር አልፈልግም።
      om: Lammata jiraachuu hin barbaadu.
    answer:
      en: "I am really glad you told me. You matter, and you deserve help right now. If you might hurt yourself soon, please press SOS or call the emergency number in Help numbers. Tell someone you trust how you feel today: a friend, family member or your embassy. Move away from anything you could use to hurt yourself. These feelings can change with support. You do not have to carry this alone."
      am: "ስለነገሩኝ በጣም ደስ ብሎኛል። እርስዎ አስፈላጊ ነዎት፤ አሁኑኑ እርዳታ ይገባዎታል። በቅርቡ ራስዎን ሊጎዱ የሚችሉ ከሆነ፣ እባክዎ SOS ይጫኑ ወይም በ«የእርዳታ ቁጥሮች» ያለውን የአደጋ ጊዜ ቁጥር ይደውሉ። ዛሬውኑ ለሚያምኑት ሰው የሚሰማዎትን ይንገሩ፤ ጓደኛ፣ ቤተሰብ ወይም ኤምባሲዎ። ራስዎን ለመጉዳት ሊጠቀሙበት ከሚችሉት ነገር ይራቁ። እነዚህ ስሜቶች በድጋፍ ሊለወጡ ይችላሉ። ይህንን ብቻዎን መሸከም የለብዎትም።"
      om: "Waan natti himteef baay'een gammade. Ati barbaachisaa dha, amma gargaarsi siif mala. Yoo dhiyootti of miidhuu dandeessa ta'e, maaloo SOS tuqi ykn lakkoofsa balaa tasaa 'Lakkoofsota Gargaarsaa' keessa jiru bilbili. Har'uma waan sitti dhaga'amu nama amanattutti himi: hiriyaa, maatii ykn embaasii kee. Waan ittiin of miidhuu dandeessu irraa fagaadhu. Miirri kun deeggarsaan jijjiiramuu danda'a. Kana qofaa kee baachuu hin qabdu."
    status: draft-ai
    tags: [mental-health, emergency]
    countries: []
    emergency: true
    articles: [loneliness-and-mental-health, mental-health-after-return]
    sources:
      - url: https://www.who.int/news-room/fact-sheets/detail/suicide
        title: Suicide (fact sheet)
        publisher: World Health Organization
        accessed: 2026-10-31
        note: Suicides can be prevented with timely, evidence-based interventions; many people at risk do not seek help.
    verified: false

  - id: faq-agency-fees
    question:
      en: The agency is asking me for a lot of money. Is that allowed?
      am: ኤጀንሲው ብዙ ገንዘብ እየጠየቀኝ ነው። ይህ ይፈቀዳል?
      om: Ejensiin maallaqa baay'ee na gaafachaa jira. Kun hayyamamaadhaa?
    answer:
      en: "Be careful. Ethiopian law sets rules on what a licensed agency may charge a worker; see 'Money, fees and debt' and the Ethiopia rights page. Always ask for a written receipt for any payment. Do not borrow money from a broker to pay fees. If an agency asks for money that the rules do not allow, or will not give a receipt, report it to the Ministry of Labour and Skills."
      am: "ይጠንቀቁ። የኢትዮጵያ ሕግ ፈቃድ ያለው ኤጀንሲ ከሠራተኛ ምን ሊያስከፍል እንደሚችል ደንብ ያስቀምጣል፤ «ገንዘብ፣ ክፍያና ዕዳ»ን እና የኢትዮጵያን የመብት ገጽ ይመልከቱ። ለማንኛውም ክፍያ ሁልጊዜ የጽሑፍ ደረሰኝ ይጠይቁ። ክፍያ ለመክፈል ከደላላ ገንዘብ አይበደሩ። ኤጀንሲው ደንቡ የማይፈቅደውን ገንዘብ ከጠየቀ ወይም ደረሰኝ ካልሰጠ ለሥራና ክህሎት ሚኒስቴር ያሳውቁ።"
      om: "Of eeggadhu. Seerri Itoophiyaa ejensiin hayyama qabu hojjetaa irraa maal kaffalchiisuu akka danda'u ni murteessa; 'Maallaqa, kaffaltii fi liqii' fi fuula mirgaa Itoophiyaa ilaali. Kaffaltii kamiifuu yeroo hunda nagahee barreeffamaa gaafadhu. Kaffaltii kaffaluuf delaalaa irraa maallaqa hin liqeeffatin. Yoo ejensiin maallaqa seerri hin hayyamne si gaafate ykn nagahee siif kennuu dide, Ministeera Hojii fi Ogummaatti himi."
    status: draft-ai
    tags: [legal, trafficking]
    countries: [ET]
    emergency: false
    articles: [money-fees-and-debt, licensed-agencies-vs-brokers, rights-et]
    sources: []
    verified: false

  - id: faq-illegal-broker
    question:
      en: A broker says he can send me abroad quickly without an agency. Is it safe?
      am: አንድ ደላላ ያለ ኤጀንሲ በፍጥነት ወደ ውጭ ሊልከኝ እንደሚችል ይናገራል። ደኅንነቱ የተጠበቀ ነው?
      om: Delaalaan tokko ejensii malee dafee biyya alaatti na erguu akka danda'u jedha. Nageenya qabaa?
    answer:
      en: "This is risky. Going through an unlicensed broker or an illegal route can lead to debt, abuse, trafficking or being stuck without papers, and you lose protections that come with a registered contract. Use only an agency licensed by Ethiopia's Ministry of Labour and Skills. Ask to see its licence and check it. Use the agency check in DadaLink, and read 'Licensed agencies vs brokers'."
      am: "ይህ አደገኛ ነው። ፈቃድ በሌለው ደላላ ወይም በሕገወጥ መንገድ መሄድ ወደ ዕዳ፣ ጥቃት፣ የሰዎች ዝውውር ወይም ያለ ሰነድ መቅረት ሊያደርስ ይችላል፤ በተመዘገበ ውል የሚገኘውን ጥበቃም ያጣሉ። በኢትዮጵያ ሥራና ክህሎት ሚኒስቴር ፈቃድ የተሰጠውን ኤጀንሲ ብቻ ይጠቀሙ። ፈቃዱን እንዲያሳይዎ ይጠይቁና ያረጋግጡ። በDadaLink ያለውን የኤጀንሲ ማረጋገጫ ይጠቀሙ፣ «ፈቃድ ያላቸው ኤጀንሲዎችና ደላሎች»ን ያንብቡ።"
      om: "Kun balaa qaba. Delaalaa hayyama hin qabneen ykn karaa seeraan alaa deemuun gara liqii, miidhaa, daldala namootaa ykn sanada malee hafuutti geessuu danda'a; eegumsa waliigaltee galmaa'een dhufu ni dhabda. Ejensii Ministeera Hojii fi Ogummaa Itoophiyaatiin hayyama argate qofa fayyadami. Hayyama isaa akka si agarsiisu gaafadhuu mirkaneeffadhu. Mirkaneessa ejensii DadaLink keessa jiru fayyadami, 'Ejensiiwwan hayyama qaban fi delaalota' dubbisi."
    status: draft-ai
    tags: [trafficking, legal]
    countries: [ET]
    emergency: false
    articles: [licensed-agencies-vs-brokers, rights-et]
    sources: []
    verified: false

  - id: faq-documents-to-keep
    question:
      en: Which documents should I copy before I leave?
      am: ከመሄዴ በፊት የትኞቹን ሰነዶች መቅዳት አለብኝ?
      om: Osoon hin deemin dura sanadoota kamii garagalchuu qaba?
    answer:
      en: "Take clear photos of your passport, visa, signed contract, Ethiopian ID, the agency's name and licence, and your employer's name, address and phone. Keep them in a safe place on your phone, and give copies to someone you trust at home. Also write the most important numbers on paper, in case your phone is taken. Never hand over your original documents to a broker."
      am: "የፓስፖርትዎን፣ የቪዛዎን፣ የፈረሙትን ውል፣ የኢትዮጵያ መታወቂያዎን፣ የኤጀንሲውን ስምና ፈቃድ፣ እንዲሁም የአሰሪዎን ስም፣ አድራሻና ስልክ ግልጽ ፎቶ ያንሱ። በስልክዎ ደኅንነቱ የተጠበቀ ቦታ ያስቀምጡ፤ ቅጂዎችን በቤት ላለ ለሚያምኑት ሰው ይስጡ። ስልክዎ ቢወሰድ እንዲረዳ በጣም አስፈላጊ ቁጥሮችን በወረቀት ላይም ይጻፉ። ዋና ሰነዶችዎን ለደላላ በጭራሽ አይስጡ።"
      om: "Suuraa ifaa paaspoortii, viizaa, waliigaltee mallatteessite, waraqaa eenyummaa Itoophiyaa, maqaa fi hayyama ejensii, akkasumas maqaa, teessoo fi bilbila hojjechiisaa keetii kaasi. Bilbila kee irratti bakka nagaa kaa'i, garagalchaa nama mana jiru kan amanattuuf kenni. Yoo bilbilli kee fudhatame jedhee lakkoofsota baay'ee barbaachisoo waraqaa irrattis barreessi. Sanadoota kee jalqabaa delaalaaf gonkumaa hin kennin."
    status: draft-ai
    tags: [documents, passport]
    countries: []
    emergency: false
    articles: [documents-to-copy, trusted-contact-and-safety-plan]
    sources: []
    verified: false

  - id: faq-call-embassy
    question:
      en: How do I contact the Ethiopian embassy, and what can they do?
      am: የኢትዮጵያ ኤምባሲን እንዴት ማግኘት እችላለሁ? ምንስ ሊያደርጉልኝ ይችላሉ?
      om: Embaasii Itoophiyaa akkamitti quunnamuu danda'a, maal naaf gochuu danda'u?
    answer:
      en: "The embassy and consulate numbers for your country are in Help numbers in DadaLink. They work offline, so save them now. When you call, say your full name, passport number if you know it, your employer's name and city, and what help you need. The embassy can give advice, contact authorities, help with travel documents and, in some cases, help you get to a shelter or go home. It cannot always solve everything quickly, so also keep your own records."
      am: "የአገርዎ የኤምባሲና የቆንስላ ቁጥሮች በDadaLink «የእርዳታ ቁጥሮች» ውስጥ አሉ። ያለ ኢንተርኔት ይሠራሉ፤ አሁኑኑ ያስቀምጧቸው። ሲደውሉ ሙሉ ስምዎን፣ ካወቁት የፓስፖርት ቁጥርዎን፣ የአሰሪዎን ስምና ከተማ እንዲሁም ምን እርዳታ እንደሚፈልጉ ይናገሩ። ኤምባሲው ምክር ሊሰጥ፣ ባለሥልጣናትን ሊያገኝ፣ በጉዞ ሰነድ ሊረዳ፣ አንዳንድ ጊዜም ወደ መጠለያ ወይም ወደ አገር እንዲሄዱ ሊረዳ ይችላል። ሁሉንም ነገር ሁልጊዜ በፍጥነት ላይፈታ ስለሚችል የራስዎን መዝገብም ይያዙ።"
      om: "Lakkoofsonni embaasii fi koonsilaa biyya keetii DadaLink keessatti 'Lakkoofsota Gargaarsaa' keessa jiru. Interneetii malee hojjetu; amma kuusi. Yeroo bilbiltu maqaa kee guutuu, yoo beekte lakkoofsa paaspoortii, maqaa fi magaalaa hojjechiisaa keetii, akkasumas gargaarsa maalii akka barbaaddu himi. Embaasiin gorsa kennuu, abbootii taayitaa quunnamuu, sanada imalaatiin gargaaruu, yeroo tokko tokkos iddoo baqannaa ykn biyyatti akka deebitu si gargaaruu danda'a. Yeroo hunda waan hunda dafee furuu dhiisuu waan danda'uuf galmee mataa keetiis qabadhu."
    status: draft-ai
    tags: [documents, repatriation, legal]
    countries: []
    emergency: false
    articles: [contacting-your-embassy]
    sources: []
    verified: false

  - id: faq-absconding-report
    question:
      en: If I leave my employer's house, will I be in trouble with the law?
      am: የአሰሪዬን ቤት ጥዬ ብወጣ በሕግ ችግር ውስጥ እገባለሁ?
      om: Yoon mana hojjechiisaa koo dhiisee bahe, rakkoo seeraa keessa nan seenaa?
    answer:
      en: "It can be risky. In several of these countries an employer can report a worker as 'absent' or 'absconded', and this can affect your legal status, so it is safer to get help before you leave if you can. Contact the labour ministry, your embassy or a shelter from Help numbers. If you are in danger, your safety comes first: press SOS or call emergency. Take your phone and copies of documents. Do not go with strangers who promise jobs."
      am: "አደጋ ሊኖረው ይችላል። በብዙዎቹ በእነዚህ አገሮች አሰሪ ሠራተኛውን «ጠፍቷል» ወይም «አምልጧል» ብሎ ሪፖርት ማድረግ ይችላል፤ ይህ የሕግ ሁኔታዎን ሊነካ ስለሚችል ከቻሉ ከመውጣትዎ በፊት እርዳታ ማግኘት ይሻላል። ሠራተኛ ሚኒስቴርን፣ ኤምባሲዎን ወይም መጠለያን ከ«የእርዳታ ቁጥሮች» ያግኙ። አደጋ ላይ ከሆኑ ደኅንነትዎ ይቀድማል፤ SOS ይጫኑ ወይም የአደጋ ጊዜ ቁጥር ይደውሉ። ስልክዎንና የሰነድ ቅጂዎችን ይያዙ። ሥራ ከሚያስገቡ ከማያውቋቸው ሰዎች ጋር አይሂዱ።"
      om: "Balaa qabaachuu danda'a. Biyyoota kanneen keessaa hedduu keessatti hojjechiisaan hojjetaa 'hin argamne' ykn 'baqate' jedhee gabaasuu danda'a; kun haala seeraa kee tuquu waan danda'uuf, yoo dandeesse osoo hin bahin dura gargaarsa argachuu wayya. Ministeera hojjettootaa, embaasii kee ykn iddoo baqannaa 'Lakkoofsota Gargaarsaa' irraa quunnamu. Yoo balaa keessa jirta, nageenyi kee dursa: SOS tuqi ykn lakkoofsa balaa tasaa bilbili. Bilbila kee fi garagalcha sanadootaa qabadhu. Namoota hin beekne kan hojii siif waadaa galan wajjin hin deemin."
    status: draft-ai
    tags: [legal, shelter, detention]
