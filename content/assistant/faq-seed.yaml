  - id: faq-change-employer
    question:
      en: Can I change to a different employer?
      am: ወደ ሌላ አሰሪ መቀየር እችላለሁ?
      om: Gara hojjechiisaa biraatti jijjiiramuu nan danda'aa?
    answer:
      en: "Sometimes, yes, but the rules are very different in each country and often need the labour ministry, the employer or the agency to agree. Some countries allow a transfer in cases such as unpaid wages or abuse. Check your country's rights page, and ask the labour ministry or your embassy before you act. Keep records of any problems in your private log; they can support your request."
      am: "አንዳንድ ጊዜ ይቻላል፤ ደንቦቹ ግን በየአገሩ በጣም ይለያያሉ፤ ብዙ ጊዜም የሠራተኛ ሚኒስቴር፣ የአሰሪው ወይም የኤጀንሲው ስምምነት ያስፈልጋል። አንዳንድ አገሮች ደሞዝ ሳይከፈል ሲቀር ወይም ጥቃት ሲኖር ዝውውር ይፈቅዳሉ። የአገርዎን የመብት ገጽ ይመልከቱ፤ እርምጃ ከመውሰድዎ በፊት ሠራተኛ ሚኒስቴርን ወይም ኤምባሲዎን ይጠይቁ። ማንኛውንም ችግር በግል ማስታወሻዎ ይመዝግቡ፤ ጥያቄዎን ሊደግፍ ይችላል።"
      om: "Yeroo tokko tokko ni danda'ama, garuu seerri biyyaa biyyatti baay'ee adda; yeroo baay'ee walii galtee ministeera hojjettootaa, hojjechiisaa ykn ejensii barbaada. Biyyoonni tokko tokko yeroo mindaan hin kaffalamne ykn miidhaan jiru jijjiirraa ni hayyamu. Fuula mirgaa biyya keetii ilaali, osoo tarkaanfii hin fudhatin dura ministeera hojjettootaa ykn embaasii kee gaafadhu. Rakkoo kamiyyuu galmee dhuunfaa keessatti galmeessi; gaaffii kee deeggaruu danda'a."
    status: draft-ai
