  - id: faq-locked-in-no-food
    question:
      en: I am locked in the house and not given enough food. What can I do?
      am: ቤት ውስጥ ተቆልፎብኛል፤ በቂ ምግብ አይሰጠኝም። ምን ማድረግ እችላለሁ?
      om: Mana keessatti cufamee jira, nyaata gahaa hin argadhu. Maal gochuu danda'a?
    answer:
      en: "Being locked in or kept hungry is abuse, and it can be a sign of forced labour or trafficking. It is not your fault. If you are in danger, press SOS or call the emergency number in Help numbers. If you can, quietly send your location to your trusted contact. Contact your embassy or an anti-trafficking or support organisation from Help numbers. Write down dates and what happens in your private log."
      am: "መቆለፍ ወይም መራብ ጥቃት ነው፤ የግዳጅ ሥራ ወይም የሰዎች ዝውውር ምልክት ሊሆን ይችላል። የእርስዎ ጥፋት አይደለም። አደጋ ላይ ከሆኑ SOS ይጫኑ ወይም በ«የእርዳታ ቁጥሮች» ያለውን የአደጋ ጊዜ ቁጥር ይደውሉ። ከቻሉ ያሉበትን ቦታ በጸጥታ ለሚያምኑት ሰው ይላኩ። ኤምባሲዎን ወይም የፀረ-ሕገወጥ ዝውውር ወይም የድጋፍ ድርጅት ከ«የእርዳታ ቁጥሮች» ያግኙ። ቀኖችንና የሚሆነውን በግል ማስታወሻዎ ይጻፉ።"
      om: "Cufamuu ykn beelaan turuun miidhaa dha; mallattoo hojii dirqamaa ykn daldala namootaa ta'uu danda'a. Dogoggora kee miti. Yoo balaa keessa jirta, SOS tuqi ykn lakkoofsa balaa tasaa 'Lakkoofsota Gargaarsaa' keessa jiru bilbili. Yoo dandeesse, bakka jirtu callisaan nama amanattutti ergi. Embaasii kee ykn dhaabbata daldala namootaa ittisu ykn deeggarsaa 'Lakkoofsota Gargaarsaa' irraa quunnamu. Guyyoota fi waan ta'u galmee dhuunfaa keessatti barreessi."
