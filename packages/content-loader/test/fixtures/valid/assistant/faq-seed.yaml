  - id: faq-passport-taken
    question:
      en: My employer took my passport. What can I do?
      am: አሰሪዬ ፓስፖርቴን ወሰደብኝ። ምን ማድረግ እችላለሁ?
    answer:
      en: "This happens to many women. It is not your fault. Keep a photo of your passport on your phone. Ask your embassy for help."
      am: "ይህ በብዙ ሴቶች ላይ ይደርሳል። የእርስዎ ጥፋት አይደለም።"
